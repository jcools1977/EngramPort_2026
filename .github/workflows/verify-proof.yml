name: Verify EngramPort proof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run proof
      - name: Run OIDC sessions on Node 22
        run: npm run session:test

      # F170: the W1-7 canary reads /dump/core; a piped host pattern sends dumps elsewhere.
      - name: Set plain core file pattern for W1-7 canary
        run: sudo sysctl -w kernel.core_pattern=core

      - name: Require Docker gates
        run: npm run docker-gates:test && npm run docker:test
        env:
          ENGRAMPORT_REQUIRE_DOCKER: "1"
